mcp_servers:
  # Java MCP Sidecar - 人员态势模块
  # 端点路径是 /mcp/personStatus（与 Java 侧车 PersonStatusMcpServerConfig 一致）
  # 根据部署方式二选一：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/personStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/personStatus
  local:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/personStatus

  # Java MCP Sidecar - 安防态势模块
  # 端点路径是 /mcp/securityStatus（与 Java 侧车 SecurityStatusMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/securityStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/securityStatus
  security:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/securityStatus

  # Java MCP Sidecar - 食堂管理模块
  # 端点路径是 /mcp/canteen（与 Java 侧 DiningHallMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/canteen
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/canteen
  canteen:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/canteen

  # Java MCP Sidecar - 车辆态势模块
  # 端点路径是 /mcp/vehicleStatus（与 Java 侧车 VehicleStatusMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/vehicleStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/vehicleStatus
  vehicle:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/vehicleStatus

  # Java MCP Sidecar - 信息发布模块
  # 端点路径是 /mcp/information（与 Java 侧 InfoPublishMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/information
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/information
  information:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/information

  # Java MCP Sidecar - 能源态势模块
  # 端点路径是 /mcp/energyStatus（与 Java 侧 EnergyMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/energyStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/energyStatus
  energy:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/energyStatus

  # Java MCP Sidecar - 会议管理模块
  # 端点路径是 /mcp/meetingStatus（与 Java 侧 MeetingMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/meetingStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/meetingStatus
  meeting:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/meetingStatus

  # Java MCP Sidecar - 消防态势模块（/mcp/fire，与 Java 侧 FireMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/fire
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/fire
  fire:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/fire

  # Java MCP Sidecar - 周界态势模块（/mcp/perimeter，与 Java 侧 PerimeterMcpServerConfig 一致）
  # 工具：perimeter:getKeyMetrics / getAreaOverview / getPerimeterAlarmStats / getAlarmOverview
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/perimeter
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/perimeter
  perimeter:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/perimeter

  # Java MCP Sidecar - 设备态势模块（/mcp/device，与 Java 侧 DeviceMcpServerConfig 一致）
  # 工具：设备态势统计（device:getEquipClass / getCategoryHealth / getMonthMaintenance /
  #      getMonthRepair / getStatisRegion / getAnfangDeviceOnlinePercentage /
  #      getGbOnlinePercentage / getMjOnlinePercentage）
  #      以及设备查询台账口径（device:getDeviceList / device:getDeviceDetail，
  #      供 device_query 意图使用；Java 侧如未实现，Python 侧会提示"工具未加载"）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/device
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/device
  device:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/device

  # Java MCP Sidecar - 综合态势总览模块（/mcp/overview，与 Java 侧 OverviewMcpServerConfig 一致）
  # 工具：overview:getBasicInfo / overview:getDeviceHealth（接口文档 §2.1）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/overview
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/overview
  overview:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/overview

  # Java MCP Sidecar - 孪生巡检模块（/mcp/inspection，与 Java 侧 InspectionMcpServerConfig 一致）
  # 工具：inspection:getTodayInspection / getTodayTasks / getInspectionStatistics / getInspectionExecutionStatus
  # 对应平台接口：/screenPatrol/todayOverview、/screenPatrol/todayTaskList、
  #              /screenPatrol/statistics、/screenPatrol/executionStatus
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/inspection
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/inspection
  inspection:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/inspection

  # 本地 Python 实现的消防态势 mock MCP 服务（fire_server.py）
  # 当前已配置 Java MCP Sidecar（fire），先注释掉；
  # Java 侧未就绪时可临时启用 fire-local 并注释上面的 fire 做自测
  # fire-local:
  #   transport: stdio
  #   command: python
  #   args:
  #     - ./mcp_servers/fire_server.py

  # 本地 Python 实现的周界态势 mock MCP 服务（perimeter_server.py）
  # 当前已配置 Java MCP Sidecar（perimeter），先注释掉；
  # Java 侧 /mcp/perimeter 未就绪时可临时启用 perimeter-local 并注释上面的 perimeter 做自测
  # perimeter-local:
  #   transport: stdio
  #   command: python
  #   args:
  #     - ./mcp_servers/perimeter_server.py

  # 本地 Python 实现的孪生巡检 mock MCP 服务（inspection_server.py）
  # 当前已配置 Java MCP Sidecar（inspection），先注释掉；
  # Java 侧 /mcp/inspection 未就绪时可临时启用 inspection-local 并注释上面的 inspection 做自测
  # inspection-local:
  #   transport: stdio
  #   command: python
  #   args:
  #     - ./mcp_servers/inspection_server.py

  # 本地 Python 实现的 person_status MCP 服务
  # 当前已改用 Java MCP Sidecar，先注释掉，避免与 Java 侧车的工具冲突
