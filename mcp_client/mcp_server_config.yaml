mcp_servers:
  # Java MCP Sidecar - 人员态势模块
  # 端点路径是 /mcp/personStatus（与 Java 侧车 PersonStatusMcpServerConfig 一致）
  # 根据部署方式二选一：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/personStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/personStatus
  local:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/personStatus

  # Java MCP Sidecar - 安防态势模块
  # 端点路径是 /mcp/securityStatus（与 Java 侧车 SecurityStatusMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/securityStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/securityStatus
  security:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/securityStatus

  # Java MCP Sidecar - 食堂管理模块
  # 端点路径是 /mcp/canteen（与 Java 侧 DiningHallMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/canteen
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/canteen
  canteen:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/canteen

  # Java MCP Sidecar - 车辆态势模块
  # 端点路径是 /mcp/vehicleStatus（与 Java 侧车 VehicleStatusMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/vehicleStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/vehicleStatus
  vehicle:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/vehicleStatus

  # Java MCP Sidecar - 信息发布模块
  # 端点路径是 /mcp/information（与 Java 侧 InfoPublishMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/information
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/information
  information:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/information

  # Java MCP Sidecar - 能源态势模块
  # 端点路径是 /mcp/energyStatus（与 Java 侧 EnergyMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/energyStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/energyStatus
  energy:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/energyStatus

  # Java MCP Sidecar - 会议管理模块
  # 端点路径是 /mcp/meetingStatus（与 Java 侧 MeetingMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/meetingStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/meetingStatus
  meeting:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/meetingStatus

  # Java MCP Sidecar - 消防态势模块（/mcp/fire，与 Java 侧 FireMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/fire
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/fire
  fire:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/fire

  # Java MCP Sidecar - 周界态势模块（/mcp/perimeter，与 Java 侧 PerimeterMcpServerConfig 一致）
  # 工具：perimeter:getKeyMetrics / getAreaOverview / getPerimeterAlarmStats / getAlarmOverview
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/perimeter
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/perimeter
  perimeter:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/perimeter

  # Java MCP Sidecar - 设备态势模块（/mcp/device，与 Java 侧 DeviceMcpServerConfig 一致）
  # 工具：设备态势统计（device:getEquipClass / getCategoryHealth / getMonthMaintenance /
  #      getMonthRepair / getStatisRegion / getAnfangDeviceOnlinePercentage /
  #      getGbOnlinePercentage / getMjOnlinePercentage）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/device
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/device
  device:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/device

  # Java MCP Sidecar - 设备查询模块（/mcp/devicequery，
  # 与 Java 侧 PlatformDeviceQueryMcp 一致，工具名前缀 device_query:）
  # 设备查询意图（device_query）用资产库口径的两个工具：
  #   device_query:listDeviceOnly  设备资产清单（**不分页**，返回裸数组；
  #                                可按 syncSource/status/name/code/spaceId 等筛，
  #                                返回行里没有 deviceTypeName，类型名靠 syncSource 对照）
  #   device_query:getDeviceDetail 设备详情（按列表返回的内部 id 查）
  # 设备态势（device_status）笼统问法的兜底也走 listDeviceOnly（按 syncSource 列设备）
  # 注意：同端点还有个分页版的 listDevice（pageCurrent/pageSize），
  #      Python 侧**不用**——列表展示和详情定位都要全量结果，翻页会漏。
  #
  # 说明：该端点还有状态统计/在线率/厂商透传另外三组工具，Python 侧暂不使用；
  #      其中 5 个接口与 /mcp/device 重叠（device:getEquipClass 等），别混用。
  # 部署方式同上：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/devicequery
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/devicequery
  devicequery:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/devicequery

  # Java MCP Sidecar - 综合态势总览模块（/mcp/overview，与 Java 侧 OverviewMcpServerConfig 一致）
  # 工具：overview:getBasicInfo / overview:getDeviceHealth（接口文档 §2.1）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/overview
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/overview
  overview:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/overview

  # Java MCP Sidecar - 孪生巡检模块（/mcp/inspection，与 Java 侧 InspectionMcpServerConfig 一致）
  # 工具：inspection:getTodayInspection / getTodayTasks / getInspectionStatistics / getInspectionExecutionStatus
  # 对应平台接口：/screenPatrol/todayOverview、/screenPatrol/todayTaskList、
  #              /screenPatrol/statistics、/screenPatrol/executionStatus
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/inspection
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/inspection
  inspection:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/inspection

  # Java MCP Sidecar - 知识库检索模块（/mcp/knowledge，与 Java 侧 KnowledgeMcpServerConfig 一致）
  # 工具：ragflow:searchKnowledge(question, datasetIds) / ragflow:listDatasets()
  # 底层是 RAGFlow HTTP API，baseUrl/apiKey/默认检索范围都配在 sidecar 的 application-*.yml，
  # Python 端不感知 RAGFlow 的地址和密钥。
  # 注意：本条目不走 langchain_mcp_adapters（direct_client 标记让 get_mcp_tools 跳过它），
  # 而是由 KnowledgeMcpClient 按 Postman 联调口径直连：
  #   initialize(protocolVersion 2025-03-26) → 响应头 Mcp-Session-Id →
  #   notifications/initialized → tools/call ragflow:searchKnowledge
  # 知识库问答同样不走意图识别：前端切到"知识库问答"模式后 payload 带 mode=kb，
  # app.py 直接交给 graph/knowledge_qa_langgraph.py 专用管线。
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/knowledge
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/knowledge
  knowledge:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/knowledge
    direct_client: true

  # Java MCP Sidecar - UE 3D 场景控制模块（/mcp/scene）
  # 工具 20 个：scene_switch_floor / scene_reset_view / scene_recover_view /
  #   scene_close_detail / scene_reset_all / scene_show_visitor_track / scene_show_camera /
  #   scene_show_inspection / scene_show_meeting_rooms / scene_show_dining /
  #   scene_show_area_overview / scene_show_device_category / scene_show_fusion /
  #   scene_focus_actor / scene_set_actor_visible / scene_set_poi_visible /
  #   scene_set_env / scene_set_area_state / scene_set_inspection_state / get_scene_state
  #
  # 注意：本条目也不走 langchain_mcp_adapters（direct_client 让 get_mcp_tools 跳过它），
  # 由 SceneMcpClient 直连，原因是业务路由头 X-Session-Id 必须逐请求注入：
  #   前端 WS hello 声明的场景会话 id → app.py 从 payload 取出 → 传给 tools/call，
  #   决定动作帧推给哪个场景页面。MultiServerMCPClient 的 header 是静态的，做不到。
  # sidecar 动作超时 15s，客户端超时取 25s；动作返回只代表"已下发"，UE 不回执。
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://10.204.146.44:2222/mcp/scene
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/scene
  scene:
    transport: streamable_http
    url: http://10.204.146.44:2222/mcp/scene
    direct_client: true

  # 本地 Python 实现的消防态势 mock MCP 服务（fire_server.py）
  # 当前已配置 Java MCP Sidecar（fire），先注释掉；
  # Java 侧未就绪时可临时启用 fire-local 并注释上面的 fire 做自测
  # fire-local:
  #   transport: stdio
  #   command: python
  #   args:
  #     - ./mcp_servers/fire_server.py

  # 本地 Python 实现的周界态势 mock MCP 服务（perimeter_server.py）
  # 当前已配置 Java MCP Sidecar（perimeter），先注释掉；
  # Java 侧 /mcp/perimeter 未就绪时可临时启用 perimeter-local 并注释上面的 perimeter 做自测
  # perimeter-local:
  #   transport: stdio
  #   command: python
  #   args:
  #     - ./mcp_servers/perimeter_server.py

  # 本地 Python 实现的孪生巡检 mock MCP 服务（inspection_server.py）
  # 当前已配置 Java MCP Sidecar（inspection），先注释掉；
  # Java 侧 /mcp/inspection 未就绪时可临时启用 inspection-local 并注释上面的 inspection 做自测
  # inspection-local:
  #   transport: stdio
  #   command: python
  #   args:
  #     - ./mcp_servers/inspection_server.py

