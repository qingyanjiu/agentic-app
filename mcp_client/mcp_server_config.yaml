mcp_servers:
  # Java MCP Sidecar - 人员态势模块
  # 端点路径是 /mcp/personStatus（与 Java 侧车 PersonStatusMcpServerConfig 一致）
  # 根据部署方式二选一：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/personStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/personStatus
  local:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/personStatus

  # Java MCP Sidecar - 安防态势模块
  # 端点路径是 /mcp/securityStatus（与 Java 侧车 SecurityStatusMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/securityStatus
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/securityStatus
  security:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/securityStatus

  # Java MCP Sidecar - 食堂管理模块
  # 端点路径是 /mcp/canteen（与 Java 侧 DiningHallMcpServerConfig 一致）
  # 部署方式与人员态势一致：
  # - Java 跑在宿主机：url: http://host.docker.internal:2222/mcp/canteen
  # - Java 跑在 Docker 且与 Python 同网络：url: http://mcp-sidecar:2222/mcp/canteen
  canteen:
    transport: streamable_http
    url: http://host.docker.internal:2222/mcp/canteen

